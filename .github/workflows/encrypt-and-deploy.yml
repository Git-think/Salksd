name: Sync obfuscated unbound scripts to unbound branch

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: source
      - uses: actions/checkout@v4
        with:
          ref: unbound
          path: destination

      - name: Obfuscate and copy
        run: |
          set -e
          for file in unbound.sh unbound_start.sh; do
            [ -f "source/$file" ] || { echo "missing source/$file"; exit 1; }
            encoded=$(base64 -w0 < "source/$file")
            if [ "$file" = "unbound_start.sh" ]; then
              {
                echo '#!/bin/sh'
                echo 'SALKSD_WORKDIR=$(cd "$(dirname "$0")" && pwd)'
                echo 'export SALKSD_WORKDIR'
                printf "printf '%%s' '%s' | base64 -d | bash -s -- \"\$@\"\n" "$encoded"
              } > "destination/$file"
            else
              {
                echo '#!/bin/sh'
                printf "printf '%%s' '%s' | base64 -d | bash -s -- \"\$@\"\n" "$encoded"
              } > "destination/$file"
            fi
            chmod +x "destination/$file"
          done

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          repository: destination
          branch: unbound
          commit_message: "Automated: sync obfuscated unbound scripts"
          commit_author: "Git-think <178362843+Git-think@users.noreply.github.com>"
